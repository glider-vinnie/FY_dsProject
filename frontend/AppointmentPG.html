<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Appointment Form</title>
  <style>
    :root {
      --primary: #0f766e;
      --light: #ecfdf5;
      --highlight: #fef9c3;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f9fafb;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    .hero-header {
      background: linear-gradient(90deg, #0f766e, #0e7490);
      color: white;
      padding: 24px 30px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    .hero-content {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 2rem;
    }

    .title-block {
      display: flex;
      flex-direction: column;
    }

    .hospital-name {
      font-size: 1.6rem;
      font-weight: bold;
    }

    .tagline {
      font-size: 0.95rem;
      opacity: 0.9;
      margin-top: 4px;
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 500;
      margin-top: 10px;
      opacity: 0.85;
    }

    .form-wrapper {
      width: 100%;
      max-width: 700px;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.1);
      position: relative;
      margin: 40px auto;
    }

    .back-button {
      position: absolute;
      top: 20px;
      left: 20px;
      background: none;
      border: none;
      font-size: 24px;
      color: #007b6e;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .back-button:hover {
      transform: scale(1.1);
    }

    h2 {
      text-align: center;
      color: #007b6e;
      margin-bottom: 30px;
    }

    form label {
      display: block;
      margin: 10px 0 5px;
      font-weight: 500;
    }

    form input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #007b6e;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      resize: vertical;
    }

    .form-row {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .form-row .field {
      flex: 1;
      min-width: 150px;
    }

    button.submit-btn {
      width: 100%;
      padding: 14px;
      background: #64d1c4;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 30px;
      transition: background 0.3s;
    }

    button.submit-btn:hover {
      background: #3ca89b;
    }

    .popup-container {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .popup-box {
      background: white;
      padding: 40px 30px;
      border-radius: 20px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.15);
      animation: zoomIn 0.3s ease;
    }

    @keyframes zoomIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .check-icon {
      font-size: 40px;
      color: green;
      margin-bottom: 15px;
    }

    .popup-box h3 {
      color: #007b6e;
      margin-bottom: 10px;
    }

    .popup-box button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .popup-box .btn-group {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .popup-box .btn-group button:first-child {
      background: #007b6e;
      color: white;
    }

    .popup-box .btn-group button:last-child {
      background: #64d1c4;
      color: white;
    }

    footer {
      background-color: #f3f4f6;
      color: #6b7280;
      padding: 20px 30px;
      text-align: center;
      font-size: 0.9rem;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="hero-header">
    <div class="hero-content">
      <div class="left">
        <div class="logo">🏥</div>
        <div class="title-block">
          <div class="hospital-name">SwasthaCare Multispeciality Hospital</div>
          <div class="tagline">Your Health, Our Priority.</div>
        </div>
      </div>
      <div class="page-title">Book Your Appointment</div>
    </div>
  </header>

  <div class="form-wrapper">
    <button class="back-button" onclick="goBack()">←</button>

    <h2>Appointment Form</h2>

    <form id="appointmentForm" onsubmit="showConfirmation(event)">
      <label>Name</label>
      <input type="text" name="name" required />

      <div class="form-row">
        <div class="field">
          <label>Age</label>
          <input type="number" name="age" required />
        </div>
        <div class="field">
          <label>Gender</label>
          <input type="text" name="gender" required />
        </div>
        <div class="field">
          <label>Mobile Number</label>
          <input type="tel" name="mobile" required />
        </div>
      </div>

      <label>Address</label>
      <input type="text" name="address" required />

      <div class="form-row">
        <div class="field">
          <label>Priority</label>
          <select name="priority" required>
            <option value="" disabled selected>Select</option>
            <option>First Meet</option>
            <option>Follow Up</option>
            <option>Diagnosis</option>
            <option>Emergency</option>
          </select>
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" name="email" required />
        </div>
      </div>

      <label>Condition & Symptoms</label>
      <textarea name="symptoms" rows="4" placeholder="Describe your condition and symptoms..." required></textarea>

      <button class="submit-btn" type="submit">Submit</button>
    </form>
  </div>

  <!-- Popup -->
  <div class="popup-container" id="popup">
    <div class="popup-box">
      <div class="check-icon">✔</div>
      <h3>Appointment Booked</h3>
      <p id="apptNumber" style="font-size: 20px; font-weight: bold; color: #005c3b; margin-top: 10px;">Appointment No: </p>

      <div class="btn-group">
        <button onclick="goToList()">Check Appointment List</button>
        <button onclick="reloadForm()">Add New Appointment</button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    © 2025 SwasthaCare Hospital. All rights reserved. | Contact: +91 98765 43210
  </footer>

  <script>
    function goBack() {
      window.location.href = "WelcomePG.html";
    }

    function showConfirmation(e) {
      e.preventDefault();
      let prevApptNo = localStorage.getItem("lastApptNo");
      let newApptNum;

      if (prevApptNo) {
        prevApptNo = parseInt(prevApptNo.replace("APT", ""));
        const increment = Math.floor(Math.random() * 50) + 1;
        newApptNum = prevApptNo + increment;
      } else {
        newApptNum = Math.floor(10000 + Math.random() * 9000);
      }

      const appointmentNo = "APT" + newApptNum;
      localStorage.setItem("lastApptNo", appointmentNo);
      document.getElementById("appointmentForm").style.display = "none";
      document.getElementById("popup").style.display = "flex";
      document.getElementById("apptNumber").innerText = "Appointment No: " + appointmentNo;
    }

    function goToList() {
      window.location.href = "appointmentList.html";
    }

    function reloadForm() {
      location.reload();
    }
  </script>

</body>
</html>
