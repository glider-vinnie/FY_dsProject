<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hospital Appointment</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f0f0f0;
    }

    .container {
      display: flex;
      width: 100%;
      height: 100vh;
      padding: 2rem;
      gap: 2rem;
    }

    .left-panel, .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      background-color: #fff;
      border-radius: 40px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    .left-panel {
      background-color: #ffffff;
      color: #00796B;
    }

    .left-panel h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .left-panel p {
      font-size: 1.1rem;
      text-align: left;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .right-panel {
      background-color: #61c4bc;
      color: #ffffff;
      text-align: center;
    }

    .right-panel p {
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .btn {
      background-color: #61c4bc;
      color: white;
      padding: 1.2rem 2.5rem;
      border: none;
      border-radius: 20px;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn.secondary {
      background-color: #e2fbff;
      width: 44ch;
      color: #00796B;
    }

    .btn.back {
      background-color: #b6fff9;
      font-size: medium;
      width: 25ch;
      color: #155353;

    }

    .btn.white {
      background-color: white;
      color: #00796B;
    }

    .btn:hover {
      opacity: 0.95;
    }

    /* Extra large main button */
    .btn.book {
      font-size: 1.4rem;
      width: 38ch;
      padding: 1.2rem 2.5rem;
    }
  </style>

  <div class="container">
    <div class="left-panel">
        <h1>Welcome!</h1>
        <p>
          Please fill out the form<br>
          to register yourself as a patient.<br>
          In case of emergencies,<br>
          select a higher priority to<br>
          ensure you are treated earlier.
        </p>
        <a href="AppointmentPG.html">
          <button class="btn book">Book Appointment</button>
        </a>
        <a href="AppointmentList.html">
          <button class="btn secondary">View your Appointment No.</button>
        </a>
        <a href="main.html">
          <button class="btn back"><-- Back to Login</button>
        </a>
      </div>
      

    <div class="right-panel">
        <h1 style="color: #f0f0f0; font-size: 5.1ch;">Staff Section</h1>
      <p>This section is for hospital staff to<br>
        view patient appointments. Patients<br>
        with higher priority will be<br>
        scheduled first.
      </p>
      <a href="StaffLogin.html">
      <button class="btn white">View Scheduled Appointments</button>
        </a>
    </div>
  </div>
</body>
</html>
